<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Innovatech Chat · Proyecto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #2563eb;
      --violeta: #7c3aed;
      --cian: #06b6d4;
      --gradiente: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #06b6d4 100%);
      --texto: #1f2430;
      --texto-suave: #5b6472;
      --tarjeta: rgba(255, 255, 255, 0.8);
      --borde: rgba(255, 255, 255, 0.7);
      --sombra: 0 8px 24px rgba(37, 99, 235, 0.15);
      --fondo-1: #eef3fd;
      --fondo-2: #f5eeff;
      --verde: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --texto: #f1f3f8;
        --texto-suave: #a7b0c0;
        --tarjeta: rgba(30, 34, 45, 0.7);
        --borde: rgba(255, 255, 255, 0.08);
        --sombra: 0 8px 24px rgba(0, 0, 0, 0.5);
        --fondo-1: #0b1120;
        --fondo-2: #150f26;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--fondo-1) 0%, var(--fondo-2) 100%);
      background-attachment: fixed;
      color: var(--texto);
      min-height: 100vh;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      line-height: 1.7;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      padding: 18px 10px 22px;
      animation: aparecer 0.6s ease both;
    }

    header .logo {
      width: 78px; height: 78px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: var(--gradiente);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: var(--sombra);
      animation: flotar 3s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: var(--gradiente);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--texto-suave);
      font-size: 1rem;
      font-weight: 500;
    }

    /* ===== BARRA DE PROGRESO ===== */
    .progreso {
      max-width: 100%;
      height: 6px;
      background: rgba(37, 99, 235, 0.12);
      border-radius: 10px;
      overflow: hidden;
      margin: 6px 0 16px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    .progreso .barra {
      height: 100%;
      width: 20%;
      background: var(--gradiente);
      border-radius: 10px;
      transition: width 0.45s ease;
    }

    /* ===== INDICADOR SECCIÓN ===== */
    .indicador {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--texto-suave);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .indicador .num {
      color: var(--azul);
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      .indicador .num { color: #8ab4ff; }
    }

    /* ===== PESTAÑAS HORIZONTALES ===== */
    .opciones {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 18px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }

    .opciones::-webkit-scrollbar { display: none; }

    .opciones button {
      flex: 0 0 auto;
      scroll-snap-align: center;
      background: var(--tarjeta);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--borde);
      border-radius: 30px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--texto);
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .opciones button:active { transform: scale(0.94); }

    .opciones button.activo {
      background: var(--gradiente);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
    }

    /* ===== PANEL ===== */
    .panel {
      background: var(--tarjeta);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: var(--sombra);
      min-height: 200px;
    }

    .panel.reflow { animation: aparecer 0.4s ease both; }

    .panel h2 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--azul);
    }

    @media (prefers-color-scheme: dark) {
      .panel h2 { color: #8ab4ff; }
    }

    .panel p, .panel li {
      color: var(--texto-suave);
      font-size: 1.08rem;
      line-height: 1.75;
      margin-bottom: 12px;
    }

    .panel strong { color: var(--texto); font-weight: 600; }

    .panel ul { padding-left: 22px; margin: 10px 0 14px; }
    .panel li { margin-bottom: 10px; }

    .panel code {
      background: rgba(37, 99, 235, 0.1);
      color: var(--azul);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Courier New', monospace;
    }

    @media (prefers-color-scheme: dark) {
      .panel code { color: #8ab4ff; background: rgba(138, 180, 255, 0.15); }
    }

    /* ===== DATO CLAVE ===== */
    .dato {
      background: var(--gradiente);
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      margin: 16px 0;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--sombra);
      line-height: 1.5;
    }

    .dato span { font-size: 1.6rem; flex-shrink: 0; }

    /* ===== PASOS NUMERADOS ===== */
    .pasos {
      counter-reset: paso;
      list-style: none;
      padding: 0;
      margin: 14px 0;
    }

    .pasos li {
      counter-increment: paso;
      position: relative;
      padding-left: 46px;
      margin-bottom: 14px;
      color: var(--texto-suave);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .pasos li::before {
      content: counter(paso);
      position: absolute;
      left: 0; top: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--gradiente);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.3);
    }

    /* ===== ARQUITECTURA ===== */
    .arquitectura {
      background: rgba(37, 99, 235, 0.08);
      border-left: 4px solid var(--azul);
      padding: 14px 16px;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      color: var(--texto);
      margin: 14px 0;
      line-height: 1.8;
      overflow-x: auto;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      .arquitectura { background: rgba(138, 180, 255, 0.1); }
    }

    /* ===== CHECKS ===== */
    .check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--texto-suave);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .check .icono-check {
      color: var(--verde);
      font-size: 1.3rem;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .check strong { color: var(--texto); font-weight: 600; }

    /* ===== BOTONES ANTERIOR / SIGUIENTE ===== */
    .navegacion {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .navegacion button {
      flex: 1;
      padding: 16px 14px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .navegacion .btn-prev {
      background: var(--tarjeta);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--borde);
      color: var(--texto);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .navegacion .btn-prev:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .navegacion .btn-next {
      background: var(--gradiente);
      color: #fff;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    }

    .navegacion .btn-next:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .navegacion button:not(:disabled):active {
      transform: scale(0.96);
    }

    /* ===== BOTÓN VOLVER ARRIBA ===== */
    .arriba {
      position: fixed;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--gradiente);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 20;
    }

    .arriba.visible { opacity: 1; pointer-events: auto; }
    .arriba:active { transform: scale(0.9); }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      color: var(--texto-suave);
      font-size: 0.8rem;
      margin-top: 26px;
      padding-bottom: 10px;
      font-weight: 500;
    }

    /* ===== ANIMACIONES ===== */
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🤖</div>
    <h1>Innovatech Chat</h1>
    <p>Plataforma web de inteligencia artificial</p>
  </header>

  <!-- Barra de progreso -->
  <div class="progreso"><div class="barra" id="barraProgreso"></div></div>

  <!-- Indicador de sección -->
  <div class="indicador">Sección <span class="num" id="numActual">1</span> de <span class="num" id="numTotal">5</span></div>

  <!-- Pestañas horizontales -->
  <nav class="opciones" id="tabs">
    <button class="activo" onclick="mostrar(this,'intro')">🏠 Introducción</button>
    <button onclick="mostrar(this,'objetivos')">🎯 Objetivos</button>
    <button onclick="mostrar(this,'funcionamiento')">⚙️ Funcionamiento</button>
    <button onclick="mostrar(this,'resultados')">📊 Resultados</button>
    <button onclick="mostrar(this,'conclusion')">🏁 Conclusión</button>
  </nav>

  <!-- Panel -->
  <main class="panel" id="panel"></main>

  <!-- Botones Anterior / Siguiente -->
  <div class="navegacion">
    <button class="btn-prev" id="btnPrev" onclick="anterior()">◀ Anterior</button>
    <button class="btn-next" id="btnNext" onclick="siguiente()">Siguiente ▶</button>
  </div>

  <button class="arriba" id="btnArriba" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <footer>© 2025 Innovatech Chat · Proyecto informativo</footer>

  <script>
    /* ===== CONTENIDO DEL PROYECTO ===== */
    const datos = {
      intro: `
        <h2>🏠 Introducción</h2>
        <p><strong>Innovatech Chat</strong> es un asistente conversacional que responde en tiempo real usando <strong>Inteligencia Artificial</strong>. Permite a cada usuario crear su cuenta, chatear con la IA y conservar el historial completo de sus conversaciones, todo desde una interfaz moderna que funciona igual de bien en computadora que en el celular.</p>
        <p>Desarrollado con <strong>Django</strong> y potenciado por la <strong>API de Groq</strong> (modelo Llama), este proyecto nace como una demostración práctica de cómo integrar tecnologías web modernas con servicios de Inteligencia Artificial.</p>
        <div class="dato"><span>💡</span> Un asistente IA accesible desde cualquier navegador</div>
      `,

      objetivos: `
        <h2>🎯 Objetivos</h2>
        <ul>
          <li>Diseñar una interfaz web sencilla e intuitiva.</li>
          <li>Integrar un modelo de lenguaje que responda consultas en tiempo real.</li>
          <li>Ofrecer respuestas rápidas y útiles al usuario.</li>
          <li>Garantizar el acceso desde dispositivos móviles.</li>
          <li>Guardar el historial de cada conversación de forma segura y personalizada.</li>
        </ul>
        <div class="dato"><span>🎯</span> Meta: un asistente útil, rápido y fácil de usar</div>
      `,

      funcionamiento: `
        <h2>⚙️ Funcionamiento</h2>
        <p>El sistema sigue una arquitectura <strong>MVT (Modelo–Vista–Template)</strong> de Django, dividida en cuatro capas:</p>
        <div class="arquitectura">
          Usuario (navegador)<br>
          &nbsp;&nbsp;↓<br>
          Frontend (HTML, CSS, JS)<br>
          &nbsp;&nbsp;↓<br>
          Backend (Django)<br>
          &nbsp;&nbsp;↓<br>
          Base de datos (SQLite) ↔ API Groq (IA)
        </div>
        <p><strong>Así viaja cada mensaje:</strong></p>
        <ol class="pasos">
          <li>Escribes tu mensaje en el chat.</li>
          <li>JavaScript lo envía al servidor sin recargar la página.</li>
          <li>Django lo guarda en la base de datos.</li>
          <li>Django lo envía, junto al historial, a la API de Groq.</li>
          <li>Groq genera la respuesta con el modelo Llama.</li>
          <li>Django la guarda y la devuelve al navegador.</li>
          <li>Se muestra en pantalla con formato <strong>Markdown</strong>, lista para leer.</li>
        </ol>
      `,

      resultados: `
        <h2>📊 Resultados</h2>
        <div class="check"><span class="icono-check">✅</span><div><strong>Chat en tiempo real</strong> — respuestas fluidas sin recargar la página.</div></div>
        <div class="check"><span class="icono-check">✅</span><div><strong>Historial persistente</strong> — cada conversación queda guardada y organizada por usuario.</div></div>
        <div class="check"><span class="icono-check">✅</span><div><strong>100% responsive</strong> — misma experiencia en computadora, tablet y celular.</div></div>
        <div class="check"><span class="icono-check">✅</span><div><strong>Extras funcionales</strong> — lectura en voz alta, exportación a PDF y renderizado de Markdown.</div></div>
        <div class="check"><span class="icono-check">✅</span><div><strong>Seguridad</strong> — autenticación de usuarios, contraseñas encriptadas y protección CSRF.</div></div>
      `,

      conclusion: `
        <h2>🏁 Conclusión</h2>
        <p><strong>Innovatech Chat</strong> demuestra que es posible construir, desde cero, una plataforma web funcional que combine autenticación de usuarios, persistencia de datos e Inteligencia Artificial en tiempo real, todo con un diseño moderno y accesible desde cualquier dispositivo.</p>
        <div class="dato"><span>🚀</span> Próximos pasos: despliegue en la nube, subida de archivos y modo oscuro</div>
        <p>El proyecto no termina aquí. Entre las próximas mejoras están el <strong>despliegue en la nube</strong>, la <strong>subida de archivos al chat</strong> y un <strong>modo oscuro</strong> para la interfaz — pasos que llevarían a Innovatech Chat de un proyecto de feria a una herramienta lista para usarse todos los días.</p>
      `
    };

    /* ===== ORDEN DE SECCIONES ===== */
    const orden = ['intro', 'objetivos', 'funcionamiento', 'resultados', 'conclusion'];
    let actual = 0;

    /* ===== MOSTRAR SECCIÓN ===== */
    function mostrar(boton, clave) {
      if (navigator.vibrate) navigator.vibrate(8);

      // Actualizar índice
      actual = orden.indexOf(clave);
      if (actual < 0) actual = 0;

      // Marcar botón activo
      document.querySelectorAll('.opciones button').forEach(b => b.classList.remove('activo'));
      if (boton) boton.classList.add('activo');

      // Guardar
      try { localStorage.setItem('pestanaActiva', clave); } catch(e) {}

      // Mostrar contenido con animación
      const panel = document.getElementById('panel');
      panel.innerHTML = datos[clave];
      panel.classList.remove('reflow');
      void panel.offsetWidth;
      panel.classList.add('reflow');

      // Actualizar indicador, barra y botones
      actualizarUI();

      // Centrar botón activo
      if (boton) boton.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

      // Scroll al inicio del panel
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ===== ACTUALIZAR UI ===== */
    function actualizarUI() {
      // Indicador
      document.getElementById('numActual').textContent = actual + 1;
      document.getElementById('numTotal').textContent = orden.length;

      // Barra de progreso
      const porcentaje = ((actual + 1) / orden.length) * 100;
      document.getElementById('barraProgreso').style.width = porcentaje + '%';

      // Botones
      document.getElementById('btnPrev').disabled = actual === 0;
      document.getElementById('btnNext').disabled = actual === orden.length - 1;
    }

    /* ===== NAVEGACIÓN ===== */
    function anterior() {
      if (actual > 0) {
        const clave = orden[actual - 1];
        const botones = document.querySelectorAll('.opciones button');
        mostrar(botones[actual - 1], clave);
      }
    }

    function siguiente() {
      if (actual < orden.length - 1) {
        const clave = orden[actual + 1];
        const botones = document.querySelectorAll('.opciones button');
        mostrar(botones[actual + 1], clave);
      }
    }

    /* ===== CARGA INICIAL ===== */
    window.addEventListener('DOMContentLoaded', () => {
      const botones = document.querySelectorAll('.opciones button');
      let clave = 'intro';
      try { clave = localStorage.getItem('pestanaActiva') || 'intro'; } catch(e) {}
      const idx = orden.indexOf(clave);
      actual = idx >= 0 ? idx : 0;
      mostrar(botones[actual], orden[actual]);
    });

    /* ===== BOTÓN VOLVER ARRIBA ===== */
    const btnArriba = document.getElementById('btnArriba');
    window.addEventListener('scroll', () => {
      btnArriba.classList.toggle('visible', window.scrollY > 200);
    });
  </script>

</body>
</html>
